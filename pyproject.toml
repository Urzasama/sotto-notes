[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sotto-notes"
version = "0.1.0"
description = "Local speech-to-notes: audio in, editable timestamped notes out."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Zhiyu Zhang" }]
keywords = ["speech-to-text", "whisper", "notes", "transcription", "local-first"]
classifiers = [
  "Environment :: Web Environment",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "faster-whisper==1.2.1",
  "av==15.1.0",
]

[project.scripts]
sotto-notes = "sotto_notes.__main__:main"

[tool.setuptools]
packages = ["sotto_notes"]
